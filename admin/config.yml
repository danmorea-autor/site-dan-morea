backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "acasa"
    label: "Pagina principală"
    files:
      - file: "continut-acasa.json"
        label: "Texte pagina principală"
        name: "acasa"
        fields:
          - {label: "Titlu principal (hero)", name: "hero_titlu", widget: "string"}
          - {label: "Citat sub titlu", name: "hero_citat", widget: "string"}
          - {label: "Rezumat carte 1 (Pe urmele destinului)", name: "carte1_rezumat", widget: "text"}
          - {label: "Text buton Amazon (carte 1)", name: "carte1_buton_amazon_text", widget: "string"}
          - {label: "Link Amazon (carte 1)", name: "carte1_buton_amazon_link", widget: "string"}
          - {label: "Rezumat carte 2 (Ești un Înger)", name: "carte2_rezumat", widget: "text"}
          - {label: "Despre autor - text 1", name: "despre_text1", widget: "text"}
          - {label: "Despre autor - text 2", name: "despre_text2", widget: "text"}

  - name: "carte1"
    label: "Pe urmele destinului"
    files:
      - file: "continut-carte1.json"
        label: "Texte carte 1"
        name: "carte1"
        fields:
          - {label: "Tagline (fraza de sub titlu)", name: "tagline", widget: "string"}
          - {label: "Descriere completă", name: "descriere", widget: "text"}
          - {label: "Text buton Comandă", name: "buton_comanda_text", widget: "string"}
          - {label: "Text buton Amazon", name: "buton_amazon_text", widget: "string"}
          - {label: "Link Amazon", name: "buton_amazon_link", widget: "string"}
      - file: "fragmente-carte1.json"
        label: "Galerie fragmente carte 1"
        name: "fragmente1"
        fields:
          - label: "Fragmente"
            name: "fragmente"
            widget: "list"
            label_singular: "Fragment"
            summary: "{{fields.text}}"
            fields:
              - {label: "Poză (opțională)", name: "imagine", widget: "image", required: false}
              - {label: "Text citat", name: "text", widget: "text"}

  - name: "carte2"
    label: "Ești un Înger"
    files:
      - file: "continut-carte2.json"
        label: "Texte carte 2"
        name: "carte2"
        fields:
          - {label: "Tagline (fraza de sub titlu)", name: "tagline", widget: "string"}
          - {label: "Descriere completă", name: "descriere", widget: "text"}
          - {label: "Text buton Comandă", name: "buton_comanda_text", widget: "string"}
          - {label: "Are buton Amazon activ?", name: "buton_amazon_activ", widget: "boolean", default: false}
          - {label: "Text buton Amazon", name: "buton_amazon_text", widget: "string", required: false}
          - {label: "Link Amazon", name: "buton_amazon_link", widget: "string", required: false}
      - file: "fragmente-carte2.json"
        label: "Galerie fragmente carte 2"
        name: "fragmente2"
        fields:
          - label: "Fragmente"
            name: "fragmente"
            widget: "list"
            label_singular: "Fragment"
            summary: "{{fields.text}}"
            fields:
              - {label: "Poză (opțională)", name: "imagine", widget: "image", required: false}
              - {label: "Text citat", name: "text", widget: "text"}

  - name: "global"
    label: "Contact & date generale"
    files:
      - file: "site-global.json"
        label: "Telefon, email, Facebook, poză autor"
        name: "global"
        fields:
          - {label: "Telefon (afișat, cu spații)", name: "telefon", widget: "string"}
          - {label: "Telefon (pentru sunat, fără spații)", name: "telefon_tel", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Link Facebook", name: "facebook", widget: "string"}
          - {label: "Link Goodreads", name: "goodreads", widget: "string", required: false}
          - {label: "Link pagină autor Amazon", name: "amazon_autor", widget: "string", required: false}
          - {label: "Poză autor", name: "autor_foto", widget: "image"}

  - name: "noutati"
    label: "Noutăți"
    files:
      - file: "noutati.json"
        label: "Lista de noutăți"
        name: "noutati"
        fields:
          - label: "Noutăți"
            name: "noutati"
            widget: "list"
            label_singular: "Noutate"
            summary: "{{titlu}} — {{data}}"
            fields:
              - {label: "Titlu", name: "titlu", widget: "string"}
              - {label: "Data", name: "data", widget: "date"}
              - {label: "Text", name: "text", widget: "text"}

  - name: "acasa_en"
    label: "🇬🇧 Homepage (English)"
    files:
      - file: "en/continut-acasa-en.json"
        label: "Homepage text"
        name: "acasa_en"
        fields:
          - {label: "Hero title", name: "hero_titlu", widget: "string"}
          - {label: "Quote under title", name: "hero_citat", widget: "string"}
          - {label: "Book 1 summary (Follow Your Destiny)", name: "carte1_rezumat", widget: "text"}
          - {label: "Amazon button text (book 1)", name: "carte1_buton_amazon_text", widget: "string"}
          - {label: "Amazon link (book 1)", name: "carte1_buton_amazon_link", widget: "string"}
          - {label: "Book 2 summary (You Are an Angel)", name: "carte2_rezumat", widget: "text"}
          - {label: "About the author - text 1", name: "despre_text1", widget: "text"}
          - {label: "About the author - text 2", name: "despre_text2", widget: "text"}

  - name: "carte1_en"
    label: "🇬🇧 Follow Your Destiny (English)"
    files:
      - file: "en/continut-carte1-en.json"
        label: "Book 1 text"
        name: "carte1_en"
        fields:
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Full description", name: "descriere", widget: "text"}
          - {label: "Order button text", name: "buton_comanda_text", widget: "string"}
          - {label: "Amazon button text", name: "buton_amazon_text", widget: "string"}
          - {label: "Amazon link", name: "buton_amazon_link", widget: "string"}
      - file: "en/fragmente-carte1-en.json"
        label: "Excerpt gallery, book 1"
        name: "fragmente1_en"
        fields:
          - label: "Excerpts"
            name: "fragmente"
            widget: "list"
            label_singular: "Excerpt"
            summary: "{{fields.text}}"
            fields:
              - {label: "Image (optional)", name: "imagine", widget: "image", required: false}
              - {label: "Quote text", name: "text", widget: "text"}

  - name: "carte2_en"
    label: "🇬🇧 You Are an Angel (English)"
    files:
      - file: "en/continut-carte2-en.json"
        label: "Book 2 text"
        name: "carte2_en"
        fields:
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Full description", name: "descriere", widget: "text"}
          - {label: "Order button text", name: "buton_comanda_text", widget: "string"}
          - {label: "Amazon button active?", name: "buton_amazon_activ", widget: "boolean", default: false}
          - {label: "Amazon button text", name: "buton_amazon_text", widget: "string", required: false}
          - {label: "Amazon link", name: "buton_amazon_link", widget: "string", required: false}
      - file: "en/fragmente-carte2-en.json"
        label: "Excerpt gallery, book 2"
        name: "fragmente2_en"
        fields:
          - label: "Excerpts"
            name: "fragmente"
            widget: "list"
            label_singular: "Excerpt"
            summary: "{{fields.text}}"
            fields:
              - {label: "Image (optional)", name: "imagine", widget: "image", required: false}
              - {label: "Quote text", name: "text", widget: "text"}

  - name: "noutati_en"
    label: "🇬🇧 News (English)"
    files:
      - file: "en/noutati-en.json"
        label: "News list"
        name: "noutati_en"
        fields:
          - label: "News"
            name: "noutati"
            widget: "list"
            label_singular: "News item"
            summary: "{{titlu}} — {{data}}"
            fields:
              - {label: "Title", name: "titlu", widget: "string"}
              - {label: "Date", name: "data", widget: "date"}
              - {label: "Text", name: "text", widget: "text"}
